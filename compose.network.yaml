name: 'network'

# AdGuard Home (LAN DNS + ad filtering) and the AdGuard VPN gateway fleet
# (vpn-oracle*) in one stack.
#
# vpn-oracle* are wrappers around the official AdGuard VPN CLI (image
# ghcr.io/alexzedim/adguard — the oraculum monorepo `adguard` app): each
# logs in with VPN_EMAIL/VPN_PASSWORD (stack.env), connects to the location
# stored in the `location` file of its volume and provides tun0 plus a SOCKS5
# proxy (per-gateway, adguardvpn-cli default port 1080). The scraper apps in
# compose.oracle.yaml join each gateway's network namespace CROSS-STACK via
# `network_mode: 'container:vpn-oracle-<x>'` — the whole pair's traffic exits
# through that gateway's tunnel. CONTRACT: a netns join is bound at
# app-container creation; restarting or recreating a gateway alone orphans
# its app (dead netns, no eth0). RULE: after ANY change to this stack, also
# "Update the stack" for oracle; never restart a vpn-oracle* container alone.
# netns-watch.sh (host cron, /etc/cron.d/netns-watch) alerts on divergence.
#
# The gateways sit on cmnw (cross-stack reachability) and on the oraculum
# stack's network (oraculum_oraculum, external) so oraculum services can use
# them: SOCKS5 is exposed on every gateway (one-time `adguardvpn-cli config
# set-socks-host 0.0.0.0` + set-socks-username/password, persisted in the
# volume; creds in ../envs/network/.stack.env). From any oraculum container:
# socks5h://vpn-oracle-<x>:1080 egresses via that gateway's VPN location.
#
# Volumes: this project is 'network' but the VPN state volumes were created
# by the former 'oracle' project — they are attached EXTERNAL under their real
# names (oracle_vpn-oracle-*-adguard) so logins, locations and SOCKS config
# survive the move; license device slots are preserved. The -geo volumes are
# shared with the apps in compose.oracle.yaml (external, real names
# oracle_oracle-*-geo). vpn-oracle-5se-adguard is the only project-scoped
# volume: that gateway was recreated fresh and re-logs-in on first boot.
#
# Deployed via Portainer (stack 'network'); envs synced with
# ../envs/network/.stack.env. Oracle ports (${ORACLE_*}) keep inline defaults.

services:
    adguard-home:
        image: adguard/adguardhome:v0.107.57
        container_name: adguard-home
        restart: always
        ports:
            - '128.0.0.255:53:53/udp'
            - '128.0.0.255:53:53/tcp'
            - '128.0.0.255:3300:3000/tcp'
        volumes:
            - /mnt/adguard/conf:/opt/adguardhome/conf
            - /mnt/adguard/work:/opt/adguardhome/work

    vpn-oracle:
        image: ghcr.io/alexzedim/adguard:latest
        pull_policy: if_not_present
        container_name: vpn-oracle
        restart: always
        healthcheck:
            test:
                - CMD-SHELL
                - 'if [ -f /var/lib/adguardvpn/mode-direct ]; then curl -s -m 8 -o /dev/null https://ifconfig.me || exit 1; else curl -s -m 8 -o /dev/null --interface tun0 https://ifconfig.me || exit 1; fi'
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 8m
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        env_file:
            - stack.env
        environment:
            APP_NAME: oracle
        volumes:
            - vpn-oracle-adguard:/var/lib/adguardvpn
            - oracle-geo:/var/lib/oraculum
        ports:
            - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_VNC_PORT:-6181}:6080'
            - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_CDP_PORT:-9321}:9222'
        networks:
            - cmnw
            - oraculum

    vpn-oracle-1d:
        image: ghcr.io/alexzedim/adguard:latest
