# AdGuard Home (LAN DNS 128.0.0.255:53 + HE-v6, DoT server on :853 serving
# adguard.cmnw.ru, UI :3300 -> https://adguard.cmnw.ru) + dns-snapshot +
# egress-proxy. Operational detail (upstreams, pins, backups, host tooling)
# lives in AGENTS-LOCAL.md "AdGuard Home (network stack)".
# The :853 publish + tls volume MUST stay or the Keenetic DoT upstream dies.
# dns-snapshot (CoreDNS :5353, stack-internal) serves the offline snapshot
# from /srv/docker/dns-snapshot as the AGH fallback upstream.
# The dns-v6 network (IPv6 ULA) gives adguard-home IPv6 egress for its
# https://[2a09::]/dns-query upstream member; the joindns4 extra_hosts pin
# backs the https://unfiltered.joindns4.eu/dns-query pool member.
#
# egress-proxy (3proxy) is an HTTP forward proxy (CONNECT) for clients on
# networks that cannot reach their model provider directly. It has no
# published port and no TLS of its own: the Caddy edge (compose.routing.yaml)
# terminates TLS on :443 for one dedicated hostname and forwards the
# decrypted stream here over the shared external `edge` network, where Caddy
# is its only neighbour. Destination policy is enforced on the RESOLVED
# address: EGRESS_PROXY_DENIED_NETS must list every range the proxy may never
# reach (loopback, RFC1918, CGNAT, link-local, plus whatever non-RFC1918
# ranges the local network uses). Compose refuses to render without it, so a
# missing variable can never yield a proxy into the local network. Who may
# use the proxy is decided at the edge, not here (AGENTS-LOCAL.md "Egress
# proxy"). Upstream: https://github.com/3proxy/3proxy — image tag pinned.

services:
    adguard-home:
        image: adguard/adguardhome:v0.107.80
        container_name: adguard-home
        restart: always
        ports:
            - '128.0.0.255:53:53/udp'
            - '128.0.0.255:53:53/tcp'
            - '[2001:470:28:284:2036:4dff:fe08:c6d3]:53:53/udp'
            - '[2001:470:28:284:2036:4dff:fe08:c6d3]:53:53/tcp'
            - '128.0.0.255:853:853/tcp'
            - '[2001:470:28:284:2036:4dff:fe08:c6d3]:853:853/tcp'
            - '128.0.0.255:853:853/udp'
            - '[2001:470:28:284:2036:4dff:fe08:c6d3]:853:853/udp'
            - '128.0.0.255:3300:3000/tcp'
        volumes:
            - /srv/docker/adguard/conf:/opt/adguardhome/conf
            - /srv/docker/adguard/tls:/opt/adguardhome/tls:ro
            - /srv/docker/adguard/work:/opt/adguardhome/work
        extra_hosts:
            - dns.sb:185.222.222.222
            - dns.quad9.net:9.9.9.9
            - d.adguard-dns.com:94.140.14.14
            - freedns.controld.com:76.76.2.11
            - wikimedia-dns.org:185.71.138.138
            - unfiltered.joindns4.eu:86.54.11.100
        networks:
            - default
            - dns-v6

    dns-snapshot:
        image: coredns/coredns:1.15.0
        container_name: dns-snapshot
        restart: always
        command: ['-conf', '/etc/coredns/Corefile']
        ports:
            - '128.0.0.255:5353:5353/udp'
            - '128.0.0.255:5353:5353/tcp'
        volumes:
            - /srv/docker/dns-snapshot:/etc/coredns:ro

# === egress proxy for clients on restricted networks ===
    egress-proxy:
        image: 3proxy/3proxy:0.9.9.4.busybox
        container_name: egress-proxy
        restart: unless-stopped
        user: '65534:65534'
        read_only: true
        command:
            - sh
            - -c
            - >-
                printf '%s\n'
                'nserver 127.0.0.11'
                'nscache 65536'
                'timeouts 1 5 30 60 180 1800 15 60'
                'log stdout'
                'deny * * ${EGRESS_PROXY_DENIED_NETS:?EGRESS_PROXY_DENIED_NETS must list the address ranges the proxy may never reach}'
                'allow *'
                'proxy -n -a -p8421'
                > /tmp/3proxy.cfg && exec 3proxy /tmp/3proxy.cfg
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        networks:
            - edge

networks:
    dns-v6:
        driver: bridge
        enable_ipv6: true
        ipam:
            config:
                - subnet: fdc2:dba5:2eae:53::/64
                  gateway: fdc2:dba5:2eae:53::1
    edge:
        external: true
        name: cmnw_edge
