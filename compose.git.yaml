name: "git"
# GitLab CI runners: two manager containers under one instance runner record
# ("core-gitlab-runner"). Each boots with `gitlab-runner register` using
# GITLAB_RUNNER_TOKEN (glrt- token, shown once in Admin -> CI/CD -> Runners;
# rotation = new token in stack env + redeploy). Registration URL is
# http://gitlab — container-to-container over the shared external `cmnw`
# network, no DNS or web round-trip; job containers join `cmnw` as well and
# get the host docker socket for image builds. Token lives in stack env only
# (never committed; .env.example keeps a blank template).
services:
  cmnw-github-runner-I:
    image: myoung34/github-runner:latest
    container_name: cmnw-github-runner-I
    environment:
      # Required: Your GitHub repository or organization
      REPO_URL: https://github.com/alexzedim/cmnw

      # Required: GitHub Personal Access Token or Registration Token
      # For repo: needs 'repo' scope
      # For org: needs 'admin:org' scope
      ACCESS_TOKEN: ${GITHUB_TOKEN}

      # Optional: Runner name (defaults to hostname)
      RUNNER_NAME: cmnw-runner-I

      # Optional: Runner labels (comma separated)
      RUNNER_LABELS: docker,linux,self-hosted,cmnw

      # Optional: Runner group (for organizations)
      # RUNNER_GROUP: default

      # Optional: Working directory
      # RUNNER_WORKDIR: /tmp/runner/work

    volumes:
      # Mount Docker socket for Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock

      # Persistent runner work directory
      - cmnw-runner-work:/tmp/runner/work

      # Optional: Mount host directories for builds
      - ./builds:/builds

      # Optional: Cache directories for faster builds
      - cmnw-runner-work:/home/runner/.cache

    restart: always

    # Optional: Resource limits
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "2.0"
          memory: 4G

    # Optional: Network configuration
    networks:
      - runner-network

    # Optional: Security options
    # security_opt:
    #    - no-new-privileges:true

  cmnw-github-runner-II:
    image: myoung34/github-runner:latest
    container_name: cmnw-github-runner-II
    environment:
      REPO_URL: https://github.com/alexzedim/cmnw
      ACCESS_TOKEN: ${GITHUB_TOKEN}
      RUNNER_NAME: cmnw-runner-II
      RUNNER_LABELS: docker,linux,self-hosted,cmnw
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cmnw-runner-work:/tmp/runner/work
      - ./builds:/builds
      - cmnw-runner-work:/home/runner/.cache
    restart: always
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "2.0"
          memory: 4G

    networks:
      - runner-network

  cmnw-github-runner-III:
    image: myoung34/github-runner:latest
    container_name: cmnw-github-runner-III
    environment:
      REPO_URL: https://github.com/alexzedim/cmnw
      ACCESS_TOKEN: ${GITHUB_TOKEN}
      RUNNER_NAME: cmnw-runner-III
      RUNNER_LABELS: docker,linux,self-hosted,cmnw
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cmnw-runner-work:/tmp/runner/work
      - ./builds:/builds
      - cmnw-runner-work:/home/runner/.cache
    restart: always
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "2.0"
          memory: 4G

    networks:
      - runner-network

  core-github-runner:
    image: myoung34/github-runner:latest
    container_name: core-github-runner
    environment:
      REPO_URL: https://github.com/alexzedim/core
      ACCESS_TOKEN: ${GITHUB_TOKEN}
      RUNNER_NAME: core-runner-I
      RUNNER_LABELS: docker,linux,self-hosted,core
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - core-runner-work:/tmp/runner/work
      - ./builds:/builds
    restart: always
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "2.0"
          memory: 4G
    networks:
      - runner-network

  # Optional: Multiple runners
  oraculum-github-runner-I:
    image: myoung34/github-runner:latest
    container_name: oraculum-github-runner-I
    environment:
      REPO_URL: https://github.com/alexzedim/oraculum
      ACCESS_TOKEN: ${GITHUB_TOKEN}
      RUNNER_NAME: oraculum-runner-I
      RUNNER_LABELS: docker,linux,self-hosted,oraculum
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - oraculum-runner-work:/tmp/runner/work
      - ./builds:/builds
    restart: always
    networks:
      - runner-network

  oraculum-github-runner-II:
    image: myoung34/github-runner:latest
    container_name: oraculum-github-runner-II
    environment:
      REPO_URL: https://github.com/alexzedim/oraculum
      ACCESS_TOKEN: ${GITHUB_TOKEN}
      RUNNER_NAME: oraculum-runner-II
      RUNNER_LABELS: docker,linux,self-hosted,oraculum
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - oraculum-runner-work:/tmp/runner/work
      - ./builds:/builds
    restart: always
    networks:
      - runner-network

  gitlab-runner-I:
    image: gitlab/gitlab-runner:alpine-v19.0.1
    container_name: gitlab-runner-I
    restart: always
    environment:
      GITLAB_RUNNER_TOKEN: ${GITLAB_RUNNER_TOKEN}
    command:
      - sh
      - -c
      - |
        if [ -z "$${GITLAB_RUNNER_TOKEN}" ]; then
          echo "GITLAB_RUNNER_TOKEN is not set" >&2
          exit 1
        fi
        gitlab-runner register --non-interactive --url http://gitlab --token "$${GITLAB_RUNNER_TOKEN}" --executor docker --description "core-gitlab-runner-I" --docker-image docker:28.5.0-cli --docker-volumes /var/run/docker.sock:/var/run/docker.sock --docker-network cmnw --template-config /etc/gitlab-runner/config-template.toml
        exec gitlab-runner run --working-directory=/home/gitlab-runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    configs:
      - source: gitlab-runner-template
        target: /etc/gitlab-runner/config-template.toml
    networks:
      - cmnw

  gitlab-runner-II:
    image: gitlab/gitlab-runner:alpine-v19.0.1
    container_name: gitlab-runner-II
    restart: always
    environment:
      GITLAB_RUNNER_TOKEN: ${GITLAB_RUNNER_TOKEN}
    command:
      - sh
      - -c
      - |
        if [ -z "$${GITLAB_RUNNER_TOKEN}" ]; then
          echo "GITLAB_RUNNER_TOKEN is not set" >&2
          exit 1
        fi
        gitlab-runner register --non-interactive --url http://gitlab --token "$${GITLAB_RUNNER_TOKEN}" --executor docker --description "core-gitlab-runner-II" --docker-image docker:28.5.0-cli --docker-volumes /var/run/docker.sock:/var/run/docker.sock --docker-network cmnw --template-config /etc/gitlab-runner/config-template.toml
        exec gitlab-runner run --working-directory=/home/gitlab-runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    configs:
      - source: gitlab-runner-template
        target: /etc/gitlab-runner/config-template.toml
    networks:
      - cmnw

  docker-prune:
    image: docker:28.5.0-cli
    container_name: docker-prune
    restart: unless-stopped
    environment:
      TZ: MSK-3
      DOCKER_PRUNE_CRON: ${DOCKER_PRUNE_CRON:-30 4 * * *}
      DOCKER_PRUNE_RETENTION: ${DOCKER_PRUNE_RETENTION:-48h}
    command:
      - sh
      - -c
      - |
        echo "$${DOCKER_PRUNE_CRON} sh /usr/local/bin/prune.sh $${DOCKER_PRUNE_RETENTION} >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
        exec /usr/sbin/crond -f -l 8
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none
    configs:
      - source: docker-prune-script
        target: /usr/local/bin/prune.sh

volumes:
  cmnw-runner-work:
    driver: local
  core-runner-work:
    driver: local
  oraculum-runner-work:
    driver: local

configs:
  docker-prune-script:
    content: |
      docker container prune -f --filter "until=$1"
      docker image prune -a -f --filter "until=$1"
      docker builder prune -a -f --filter "until=$1"
  gitlab-runner-template:
    content: |
      concurrent = 2
      check_interval = 3
      log_level = "info"

networks:
  runner-network:
    driver: bridge
  storage-network:
    driver: bridge
  cmnw:
    external: true
