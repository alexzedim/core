name: 'oraculum'
services:
  indexator:
    image: ghcr.io/alexzedim/indexator:latest
    pull_policy: if_not_present
    container_name: indexator
    restart: always
    command: ['node', 'dist/apps/indexator/src/main.js']
    env_file:
      - stack.env
    environment:
      NODE_ENV: production
      APP_NAME: indexator
      LIGHTRAG_URL: http://lightrag:8084
    networks:
      - oraculum

  oracular:
    image: ghcr.io/alexzedim/oracular:latest
    pull_policy: if_not_present
    container_name: oracular
    restart: always
    command: ['node', 'dist/apps/oracular/src/main.js']
    env_file:
      - stack.env
    environment:
      NODE_ENV: production
      APP_NAME: oracular
      HTTP_PROXY: http://128.0.0.255:3128
      HTTPS_PROXY: http://128.0.0.255:3128
      NO_PROXY: localhost,127.0.0.1,128.0.0.255,oraculum,indexator,archivum,lightrag,gateway,rabbitmq,redis,api.neuraldeep.ru
    networks:
      - oraculum

  archivum:
    image: ghcr.io/alexzedim/archivum:latest
    pull_policy: if_not_present
    container_name: archivum
    restart: always
    command: ['node', 'dist/apps/archivum/src/main.js']
    env_file:
      - stack.env
    environment:
      NODE_ENV: production
      APP_NAME: archivum
    networks:
      - oraculum

  gateway:
    image: ghcr.io/alexzedim/gateway:latest
    pull_policy: if_not_present
    container_name: gateway
    restart: always
    command: ['node', 'dist/apps/gateway/src/main.js']
    env_file:
      - stack.env
    environment:
      NODE_ENV: production
      APP_NAME: gateway
      FORWARD_PROXY_BIND: 0.0.0.0
      FORWARD_PROXY_PORT: 3128
      FORWARD_PROXY_HEALTH_PORT: 3129
      FORWARD_PROXY_UPSTREAM_TIMEOUT_MS: 90000
      FORWARD_PROXY_HEADER_READ_TIMEOUT_MS: 10000
      FORWARD_PROXY_MAX_HEADER_BYTES: 65536
    network_mode: host
    volumes:
      - gateway-adguard:/var/lib/adguardvpn:rw

  lightrag:
    image: registry.cmnw.ru/ai-platform/lightrag:dev
    pull_policy: if_not_present
    container_name: lightrag
    restart: always
    ports:
      - '${LIGHTRAG_BIND_IP:-128.0.0.255}:9621:8084'      # LightRAG fork API (LAN only)
    env_file:
      - stack.env
    environment:
      POSTGRES_HOST: ${LIGHTRAG_PG_HOST}
      POSTGRES_PORT: ${LIGHTRAG_PG_PORT}
      POSTGRES_USER: ${LIGHTRAG_PG_USER}
      POSTGRES_PASSWORD: ${LIGHTRAG_PG_PASSWORD}
      POSTGRES_DATABASE: ${LIGHTRAG_PG_DB}
      PORT: ${PORT:-8084}
    networks:
      - oraculum
    security_opt:
      - no-new-privileges:true

  lightrag-worker:
    image: registry.cmnw.ru/ai-platform/lightrag:dev
    pull_policy: if_not_present
    container_name: lightrag-worker
    restart: always
    command: ['python', '-m', 'lightrag.worker']
    env_file:
      - stack.env
    environment:
      POSTGRES_HOST: ${LIGHTRAG_PG_HOST}
      POSTGRES_PORT: ${LIGHTRAG_PG_PORT}
      POSTGRES_USER: ${LIGHTRAG_PG_USER}
      POSTGRES_PASSWORD: ${LIGHTRAG_PG_PASSWORD}
      POSTGRES_DATABASE: ${LIGHTRAG_PG_DB}
      RABBITMQ_URL: "amqp://${RABBIT_USER}:${RABBIT_PASSWORD}@${RABBIT_HOST}:${RABBIT_PORT}/${RABBIT_VHOST}"
    networks:
      - oraculum
    security_opt:
      - no-new-privileges:true

volumes:
  gateway-adguard:

networks:
  oraculum:
    driver: bridge
