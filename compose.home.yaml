name: 'home'

# Home Assistant only — patch-build of the upstream image
# (.github/workflows/build-home-assistant.yml → home-assistant/Dockerfile):
# the official НУЦ CA bundle is folded into the image
# trust stores because the vendor cloud gateway serves a Russian Trusted
# chain the stock image does not trust (without it the vendor integration
# goes setup_retry and all its entities go unavailable). Update flow: bump
# the upstream tag in the Dockerfile AND the workflow tags, push, rebuild,
# swap the tag below, "Update the stack" in Portainer.
#
# host network for mDNS discovery of LAN devices; binds 8123 directly.
# LAN-only http://128.0.0.255:8123 and https://home.cmnw.ru via the Caddy
# panel (geoblocked to the LAN + the voice-assistant cloud's
# CIDRs). No privileged mode, no MQTT/Zigbee/Z-Wave sidecars — all devices
# are Wi-Fi/cloud or local-protocol. Device specifics (vendors, models,
# hostnames, IPs) are intentionally not committed to this public repo.

services:
    home-assistant:
        image: ghcr.io/alexzedim/home-assistant:2026.9.4-nuc
        pull_policy: if_not_present
        container_name: home-assistant
        restart: always
        network_mode: host
        environment:
            - TZ=${TZ}
        volumes:
            - home-assistant-config:/config

volumes:
    home-assistant-config:
        name: home-assistant-config
        driver: local
        driver_opts:
            type: none
            o: bind
            device: '/mnt/home-assistant'
