name: 'home'

# Home Assistant only. The old 6-service smart-home template (mosquitto,
# node-red, zigbee2mqtt, zwave-js-ui, influxdb, traefik labels) was never
# deployed and is gone (2026-10-05): all current devices are Wi-Fi/cloud —
# no Zigbee/Z-Wave dongles, no MQTT devices. Device specifics (vendors,
# models, hostnames, IPs) are intentionally not committed to this public
# repo.
#
# host network is required for mDNS discovery and local control of LAN
# devices; it binds 8123 directly on the host. LAN-only:
# http://128.0.0.255:8123 — publish through the Caddy panel later if ever
# needed. No privileged: no USB/Bluetooth hardware is passed through.
#
# Integrations live in HACS (none tracked in core): a smart speaker
# (media_player + TTS, mDNS local mode), smart bulbs + hub via a cloud-only
# vendor integration, and a locally controlled robot vacuum.

services:
    home-assistant:
        image: ghcr.io/home-assistant/home-assistant:2026.9.4
        container_name: home-assistant
        restart: always
        network_mode: host
        # The vendor cloud gateway serves a private RU CA
        # chain the image does not trust — mount the vendor CA bundle (LF PEM at /mnt/home-assistant/nuc_official.pem) and fold
        # it into the container CA stores before handing off to /init.
        # $$ escapes docker-compose interpolation; the wrapper is idempotent
        # and re-applies after every image update.
        entrypoint: /bin/sh -c "update-ca-certificates >/dev/null 2>&1; C=$$(python3 -c 'import certifi; print(certifi.where())' 2>/dev/null); if [ -n \"$$C\" ] && ! grep -q 'Russian Trusted Root CA' \"$$C\" 2>/dev/null; then cat /usr/local/share/ca-certificates/nuc_official.pem >> \"$$C\"; fi; exec /init"
        environment:
            - TZ=${TZ}
        volumes:
            - home-assistant-config:/config
            - /mnt/home-assistant/nuc_official.pem:/usr/local/share/ca-certificates/nuc_official.pem:ro

volumes:
    home-assistant-config:
        name: home-assistant-config
        driver: local
        driver_opts:
            type: none
            o: bind
            device: '/mnt/home-assistant'
