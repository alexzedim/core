name: 'analytics'

# Monitoring stack: Prometheus + Grafana + Loki + Promtail + exporters.
#
# Config files are HOST bind mounts, not inline `configs:` blocks: canonical
# copies live in the repo (prometheus/prometheus.yml, loki/loki-config.yaml)
# and are deployed to /srv/docker/analytics/ on the host. Bearer tokens for
# the MinIO and Home Assistant scrape targets are mounted as files
# (/srv/docker/analytics/{minio,hass}.token) and referenced via
# `credentials_file` — compose interpolation of `${VAR}` does not happen
# inside bind-mounted files. Only DATA_SOURCE_NAME (postgres_exporter DSN)
# still comes from the Portainer stack env; the GF_* Grafana settings are
# inlined below (non-secret, LAN-only).

services:
    loki:
        container_name: loki
        image: grafana/loki:3.6.3
        restart: always
        ports:
            - '3100:3100'
        command: -config.file=/etc/loki/local-config.yaml
        volumes:
            - loki:/loki
            - /srv/docker/analytics/loki-config.yaml:/etc/loki/local-config.yaml:ro
        networks:
            - loki

    promtail:
        container_name: promtail
        image: grafana/promtail:3.6.3
        restart: always
        volumes:
            - /var/log:/var/log
        command: -config.file=/etc/promtail/config.yml
        networks:
            - loki

    prometheus:
        container_name: prometheus
        image: prom/prometheus:v3.15.0
        restart: always
        ports:
            - '9090:9090'
        volumes:
            - prometheus_data:/prometheus
            - /srv/docker/analytics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - /srv/docker/analytics/minio.token:/etc/prometheus/minio.token:ro
            - /srv/docker/analytics/hass.token:/etc/prometheus/hass.token:ro
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.console.libraries=/etc/prometheus/console_libraries'
            - '--web.console.templates=/etc/prometheus/consoles'
            - '--storage.tsdb.retention.time=720h'
            - '--web.enable-lifecycle'
        networks:
            - loki
            - cmnw

    postgres_exporter:
        container_name: postgres_exporter
        image: prometheuscommunity/postgres-exporter:v0.20.1
        restart: always
        environment:
            DATA_SOURCE_NAME: ${DATA_SOURCE_NAME}
            PG_EXPORTER_WEB_LISTEN_ADDRESS: ':9187'
            PG_EXPORTER_WEB_TELEMETRY_PATH: '/metrics'
            PG_EXPORTER_DISABLE_SETTINGS_METRICS: false
        networks:
            - loki

    grafana:
        container_name: grafana
        image: grafana/grafana:13.2.3
        restart: always
        environment:
            GF_PATHS_PROVISIONING: /etc/grafana/provisioning
            GF_AUTH_ANONYMOUS_ENABLED: true
            GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
            GF_FEATURE_TOGGLES_ENABLE: alertingSimplifiedRouting,alertingQueryAndExpressionsStepMode
            GF_PLUGIN_GRAFANA_IMAGE_RENDERER_RENDERING_IGNORE_HTTPS_ERRORS: true
            GF_PLUGIN_PUBLIC_KEY_RETRIEVAL_DISABLED: true
            GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: false
            GF_ANALYTICS_CHECK_FOR_UPDATES: false
            GF_ANALYTICS_REPORTING_ENABLED: false
            GF_INSTALL_IMAGE_RENDERER_PLUGIN: false
            GF_SERVER_ROOT_URL: https://grafana.cmnw.ru
            GF_SERVER_PROTOCOL: http
        ports:
            - '3000:3000'
        volumes:
            - grafana:/var/lib/grafana
        networks:
            - loki
            - cmnw

    node-exporter:
        container_name: node-exporter
        image: prom/node-exporter:v1.9.1
        restart: always
        command:
            - '--path.rootfs=/rootfs'
            - '--path.procfs=/host/proc'
            - '--path.sysfs=/host/sys'
        pid: host
        volumes:
            - '/:/rootfs:ro,rslave'
            - '/proc:/host/proc:ro'
            - '/sys:/host/sys:ro'
        networks:
            - cmnw

networks:
    loki:
        driver: bridge
    cmnw:
        external: true

volumes:
    grafana:
    prometheus_data:
    loki:
        driver: local
        driver_opts:
            type: 'none'
            o: 'bind'
            device: '/srv/docker/loki'
