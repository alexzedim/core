# Lab variant of ai-documents/web-nginx-default.conf: plain HTTP, no TLS,
# no SIGMABOT-419 plane upstreams (planes are not deployed on this host —
# nginx would fail to resolve their hostnames at startup).
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen                8080;

    server_name           _;
    root                  /usr/share/nginx/html;
    index                 index.html index.htm;

    proxy_set_header      X-Forwarded-Host $host;
    proxy_set_header      X-Forwarded-Server $host;
    proxy_set_header      X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout    600;
    proxy_connect_timeout 600;
    proxy_send_timeout    600;

    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        if ( $uri = '/index.html' ) {
            add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0' always;
        }
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location /api {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Headers *;
        proxy_pass http://ai-documents-backend:2050;
        proxy_intercept_errors off;
        client_max_body_size 16144m;
    }

    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Headers *;
        proxy_pass http://ai-documents-backend:2050;
        proxy_intercept_errors off;
        client_max_body_size 16144m;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
