name: 'ai'
version: '3.8'

# ============================================================================
# AI Stack — MCP servers, chat UI, and graph-RAG server
#
# Reused storage services (defined in docker-compose.storage.yml, reached over
# the `cmnw` network):
#   - postgres   → LightRAG KV + Doc-Status + Vector (pgvector)
#   - neo4j      → LightRAG graph storage
# (Qdrant remains in storage.yml for other apps but is no longer used by LightRAG.)
#
# Services defined here:
#   - github-mcp-server / mcp-grafana  — MCP integrations
#   - open-webui                       — chat UI (OpenRouter backend)
#   - lightrag                         — graph-RAG server (OpenRouter for LLMs,
#                                        HuggingFace for embeddings & rerank,
#                                        no Ollama dependency)
# ============================================================================

services:
  github-mcp-server:
    image: ghcr.io/github/github-mcp-server
    container_name: github-mcp-server
    environment:
      MCP_SERVER_NAME: github
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
    ports:
      - "3001:3000"
    volumes:
      - mcp-github-data:/data
    restart: always
    networks:
      - cmnw

  mcp-grafana:
    container_name: mcp-grafana
    image: mcp/grafana:latest
    restart: always
    environment:
      GRAFANA_URL: ${GRAFANA_URL}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}
    ports:
      - "8001:8001"
    command: ["--transport", "sse", "--address", "0.0.0.0:8001"]
    networks:
      - cmnw

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - "3080:8080"      # Web UI
    environment:
      OPENAI_API_BASE_URL: ${OPENROUTER_BASE_URL}
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      WEBUI_AUTH: ${WEBUI_AUTH}
    volumes:
      - open-webui:/app/backend/data
    networks:
      - cmnw
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # LightRAG — Graph-RAG server (HKUDS/LightRAG)
  # ============================================================================
  # - LLMs via OpenRouter (OpenAI-compatible binding)
  # - Embeddings + rerank via HuggingFace (sentence-transformers), runs in-process
  # - Graph → Neo4j | Vector → Qdrant | KV + Doc-Status → existing Postgres
  # - No Ollama dependency
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lightrag
    restart: always
    ports:
      - "9621:9621"      # LightRAG API + Web UI
    environment:
      HOST: 0.0.0.0
      PORT: 9621

      # ── Security ──
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY}
      TOKEN_SECRET: ${LIGHTRAG_TOKEN_SECRET}

      # ── Storage role → engine mapping ──
      # Hybrid: KV/Doc-status/Vector on existing Postgres+pgvector, Graph on Neo4j.
      LIGHTRAG_KV_STORAGE: PGKVStorage
      LIGHTRAG_DOC_STATUS_STORAGE: PGDocStatusStorage
      LIGHTRAG_GRAPH_STORAGE: Neo4JStorage
      LIGHTRAG_VECTOR_STORAGE: PGVectorStorage

      # ── PostgreSQL (existing service on `cmnw` network) ──
      # KV, doc-status, and vector (pgvector) all live here.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_LIGHTRAG_DB}
      POSTGRES_WORKSPACE: lightrag

      # pgvector HNSW tuning
      POSTGRES_VECTOR_INDEX_TYPE: hnsw_cosine
      POSTGRES_HNSW_M: 16
      POSTGRES_HNSW_EF: 200

      # ── Neo4j (from storage.yml) ──
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

      # ── LLM via OpenRouter (OpenAI-compatible) ──
      LLM_BINDING: openai
      LLM_BINDING_HOST: ${OPENROUTER_BASE_URL}
      LLM_BINDING_API_KEY: ${OPENROUTER_API_KEY}
      LLM_MODEL: ${LIGHTRAG_LLM_MODEL}                 # EXTRACT role (default)

      # Cost/quality routing per role — all via OpenRouter
      KEYWORD_LLM_BINDING: openai
      KEYWORD_LLM_BINDING_HOST: ${OPENROUTER_BASE_URL}
      KEYWORD_LLM_BINDING_API_KEY: ${OPENROUTER_API_KEY}
      KEYWORD_LLM_MODEL: ${LIGHTRAG_KEYWORD_LLM_MODEL}

      QUERY_LLM_BINDING: openai
      QUERY_LLM_BINDING_HOST: ${OPENROUTER_BASE_URL}
      QUERY_LLM_BINDING_API_KEY: ${OPENROUTER_API_KEY}
      QUERY_LLM_MODEL: ${LIGHTRAG_QUERY_LLM_MODEL}

      # ── Embeddings via HuggingFace (sentence-transformers, in-process) ──
      EMBEDDING_BINDING: huggingface
      EMBEDDING_MODEL: ${LIGHTRAG_EMBEDDING_MODEL}

      # ── Rerank via HuggingFace (sentence-transformers, in-process) ──
      RERANK_BINDING: huggingface
      RERANK_MODEL: ${LIGHTRAG_RERANK_MODEL}

      # ── Tuning ──
      MAX_ASYNC_LLM: 4
      EXTRACT_ASYNC_LLM: 4
      EMBEDDING_FUNC_MAX_ASYNC: 16
      EMBEDDING_BATCH_NUM: 32
      LLM_TIMEOUT: 120
      EXTRACT_LLM_TIMEOUT: 240

      # ── HuggingFace cache inside the bind mount ──
      # Redirects model downloads (bge-m3, reranker) to /app/data/hf-cache so
      # they persist with the rest of the workspace under /mnt/lightrag.
      HF_HOME: /app/data/hf-cache
    volumes:
      # Single bind mount covers the LightRAG workspace (rag_storage, inputs,
      # prompts) and the HuggingFace model cache (via HF_HOME=/app/data/hf-cache
      # below) so downloaded embedding/rerank weights persist across restarts.
      - lightrag-data:/app/data
    networks:
      - cmnw
    security_opt:
      - no-new-privileges:true

# ============================================================================
# Named Volumes
# ============================================================================
volumes:
  mcp-github-data:
    driver: local

  open-webui:
    driver: local

  lightrag-data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/mnt/lightrag'

# ============================================================================
# Networks
# ============================================================================
networks:
  cmnw:
    external: true
