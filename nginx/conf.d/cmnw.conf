map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# NOTE: Do NOT use `upstream {}` blocks with hostnames here.
# They resolve the hostname ONCE at config-load and cache it forever, so any
# container recreate (new IP) causes 502 "Host is unreachable" until a manual
# reload. Instead we use `set $upstream_xxx` + `proxy_pass http://$upstream_xxx`,
# which forces nginx to honor the resolver TTL (127.0.0.11 valid=30s, set in
# nginx.conf) and re-resolve Docker service names dynamically.

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name cmnw.me www.cmnw.me cmnw.xyz www.cmnw.xyz cmnw.ru www.cmnw.ru;

  # Let's Encrypt ACME HTTP-01 challenge (webroot at /mnt/nginx/acme on host)
  location /.well-known/acme-challenge/ {
    root /etc/nginx/acme;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# cmnw.me + www.cmnw.me
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name cmnw.me www.cmnw.me;

  ssl_certificate     /etc/nginx/.certs/cmnw.me.pem;
  ssl_certificate_key /etc/nginx/.certs/cmnw.me.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:TLS:10m;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  location = /api {
    set $upstream_api cmnw-api:8080;
    proxy_pass http://$upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
  }

  location ^~ /api/ {
    set $upstream_api cmnw-api:8080;
    proxy_pass http://$upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
  }

  location / {
    set $upstream_next cmnw-next:8081;
    proxy_pass http://$upstream_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
  }
}

