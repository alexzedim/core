# ============================================================================
# RabbitScout Reverse Proxy Configuration
# ============================================================================
#
# Proxy HTTPS traffic to the RabbitScout container (RabbitMQ management UI)
# at http://rabbit-scout:3000 (storage stack, cmnw network).
#
# Domains:
#   - rabbit.cmnw.me (Cloudflare-proxied wildcard *.cmnw.me)
#
# Why HTTPS matters here: RabbitScout sets its rmq-session cookie with the
# Secure flag in production, so the login form loops forever when the UI is
# reached over plain HTTP (http://core.cmnw:15673). Serving it behind nginx
# over TLS makes the cookie storable and login work.
#
# Features:
#   - SSL/TLS termination with the *.cmnw.me Cloudflare Origin certificate
#   - WebSocket upgrade passthrough for live metric updates
#   - 32m body limit for publishing larger messages from the UI
# ============================================================================

# Dynamic upstream resolution — do NOT use `upstream {}` blocks with hostnames.
# They cache the container IP at config-load time and cause 502 on recreate.
# Instead, `set $upstream_*` + proxy_pass forces nginx to honor the resolver
# TTL (127.0.0.11 valid=30s, set in nginx.conf) and re-resolve dynamically.
# See cmnw.conf for the same pattern.

# HTTP Server - Redirect to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name rabbit.cmnw.me;

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS Server
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name rabbit.cmnw.me;

  # SSL Certificate Configuration
  ssl_certificate     /etc/nginx/.certs/cmnw.me.pem;
  ssl_certificate_key /etc/nginx/.certs/cmnw.me.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:TLS:10m;

  # Security Headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Message publishing from the UI
  client_max_body_size 32m;

  # Live-updates streams (SSE/WebSocket) can be long-lived
  proxy_connect_timeout 60;
  proxy_send_timeout 60;
  proxy_read_timeout 60;
  send_timeout 60;

  location / {
    set $upstream_rabbit rabbit-scout:3000;
    proxy_pass http://$upstream_rabbit;
    proxy_http_version 1.1;

    # Standard proxy headers
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
  }
}
