# ============================================================================
# Oracle Fleet Reverse Proxy Configuration
# ============================================================================
#
# Per-variant diagnostics vhosts for the oracle Discord-capture fleet
# (oracle / oracle-1d / oracle-2bd / oracle-3s, see docker-compose.oracle.yml).
#
# The oracle apps listen on :3000 inside the vpn-* gateway netns, so the
# upstreams are the gateway containers themselves, reached over the shared
# external `cmnw` network (the gateways list it as their second network —
# keep `oraculum` first so the netns default route stays on eth0 for
# gateway-net.sh).
#
# Domains (wildcard *.cmnw.ru cert, synced by cert-sync) — LAN-ONLY:
# no public DNS records; clients resolve the names via hosts-file entries
# pointing at the server's LAN address (128.0.0.255). Access is restricted
# to the local network (128.0.0.0/16) below regardless of how traffic arrives.
#
# Endpoints per variant (served by the app):
#   /              — fleet landing page (nginx static, html/oracle-landing.html)
#   /status/page   — pipeline status dashboard
#   /logs/page     — event log
#   /status,/logs  — raw JSON
#
# noVNC (:608x) and Chrome CDP (:922x) stay on directly published host ports
# (6181-6184 / 9321-9324) — interactive debug surfaces, not proxied.
# ============================================================================

# Dynamic upstream resolution — do NOT use `upstream {}` blocks with hostnames.
# They cache the container IP at config-load time and cause 502 on recreate.
# Instead, `set $upstream_*` + proxy_pass forces nginx to honor the resolver
# TTL (127.0.0.11 valid=30s, set in nginx.conf) and re-resolve dynamically.
# See cmnw.conf for the same pattern.

map $host $oracle_upstream {
  oracle.cmnw.ru      vpn-oracle:3000;
  oracle-1d.cmnw.ru   vpn-oracle-1d:3000;
  oracle-2bd.cmnw.ru  vpn-oracle-2bd:3000;
  oracle-3s.cmnw.ru   vpn-oracle-3s:3000;
}

# HTTP Server - Redirect to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name oracle.cmnw.ru oracle-1d.cmnw.ru oracle-2bd.cmnw.ru oracle-3s.cmnw.ru;

  # LAN-only — reject anything that is not from the local network
  allow 128.0.0.0/16;
  deny all;

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS Server - all four variants (single wildcard cert)
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name oracle.cmnw.ru oracle-1d.cmnw.ru oracle-2bd.cmnw.ru oracle-3s.cmnw.ru;

  # SSL Certificate Configuration
  ssl_certificate     /etc/nginx/.certs/cmnw.ru.pem;
  ssl_certificate_key /etc/nginx/.certs/cmnw.ru.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:TLS:10m;

  # Security Headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # LAN-only — reject anything that is not from the local network
  allow 128.0.0.0/16;
  deny all;

  # Fleet landing page — links to every variant's dashboards
  location = / {
    root /etc/nginx/html;
    try_files /oracle-landing.html =404;
  }

  # Main proxy — app status/log/login endpoints
  location / {
    set $upstream_oracle $oracle_upstream;
    proxy_pass http://$upstream_oracle;
    proxy_http_version 1.1;

    # Standard proxy headers
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
  }
}
