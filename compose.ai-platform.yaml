# ============================================================================
# ai-platform lab — ai-documents (backend/worker/indexator + frontend) + wiki
# ============================================================================
# Deployed as a Portainer Repository stack (this repo, master). Env values
# never live in this public repo: they come from the Portainer stack env,
# kept in sync with ../envs/ai-platform/.stack.env (see .env.example).
#
# Images: the rolling :dev aliases — "Update the stack" with re-pull always
# deploys the newest dev build of every repo (every push to the repos' dev
# branch produces a build). For a rollback, temporarily pin a specific
# v{ver}-dev.{sha} tag (the registry keeps the 2 newest per repo). One
# unified backend image serves all three roles via APP_NAME.
#
# Reuses host services (no own DB/redis/broker): postgres :5432 (core,
# databases ai-documents-dev + wiki), redis :6379 db 5, lightrag :9621
# (oraculum stack), MinIO :9000 (region russia-1), rabbitmq :5672 (vhost
# ai-platform), loki :3100. Public hosts (caddy edge): ai-documents.cmnw.ru
# → :2051, wiki.cmnw.ru → :2054, s3.cmnw.ru → :9000. Host ports are one tight batch: 2050 backend, 2051 frontend, 2052 worker, 2053 indexator, 2054 wiki.
#
# The frontend nginx config is NOT mounted from this repo: Portainer git
# stacks (2.45) pre-create mountpoint dirs for repo-relative bind paths and
# convert file bind sources to dirs on every deploy, so per-file mounts can
# never come up. The full /etc/nginx tree (stock + our web-nginx.conf and
# conf.d/default.conf) lives in the external volume ai_platform_nginx_conf,
# seeded once from the running image + this repo; reseed the same way after
# changing the confs.
#
# env_file is required:false on purpose: Portainer CE 2.45 validates the
# compose file (compose-go) for every NON-admin redeploy right after the
# fresh clone, BEFORE the deployer writes stack.env (admin redeploys skip
# that validation), so a plain `- stack.env` fails with "env file ... not
# found". The deployer writes stack.env from the stack env at deploy time;
# required:false only lets validation pass while the file is not there yet.
# ============================================================================
name: 'ai-platform'

services:
  ai-documents-backend:
    image: registry.cmnw.ru/ai-platform/ai-documents-backend:dev
    container_name: ai-documents-backend
    restart: unless-stopped
    ports:
      - '128.0.0.255:2050:2050'
    env_file:
      - path: stack.env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-2050}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - cmnw

  ai-documents-worker:
    image: registry.cmnw.ru/ai-platform/ai-documents-backend:dev
    container_name: ai-documents-worker
    restart: unless-stopped
    environment:
      APP_NAME: worker
      WORKER_PORT: 3100
    ports:
      - '128.0.0.255:2052:3100'
    env_file:
      - path: stack.env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${WORKER_PORT:-3100}/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - cmnw

  ai-documents-indexator:
    image: registry.cmnw.ru/ai-platform/ai-documents-backend:dev
    container_name: ai-documents-indexator
    restart: unless-stopped
    environment:
      APP_NAME: indexator
      INDEXATOR_PORT: 3101
    ports:
      - '128.0.0.255:2053:3101'
    env_file:
      - path: stack.env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${INDEXATOR_PORT:-3101}/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - cmnw

  ai-documents-frontend:
    image: registry.cmnw.ru/ai-platform/ai-documents-frontend:dev
    container_name: ai-documents-frontend
    restart: always
    ports:
      - '128.0.0.255:2051:8080'
    env_file:
      - path: stack.env
        required: false
    volumes:
      - ai_platform_nginx_conf:/etc/nginx:ro
    networks:
      - cmnw

  # Unified marketplace service (apps/marketplace): skills + esb + bundles
  # control planes and the MCP gateway edge (routes /api/v1/skills*,
  # /api/v1/esb*, /api/v1/bundles*, /mcp, /hooks). Runs ALL schema migration
  # chains (skill/esb/bundle/marketplace) before boot. In-app gateway
  # dispatch targets the control plane on the same listener.
  ai-documents-marketplace:
    image: registry.cmnw.ru/ai-platform/ai-documents-backend:dev
    container_name: ai-documents-marketplace
    restart: unless-stopped
    environment:
      APP_NAME: marketplace
      ESB_CONTROL_URL: http://localhost:2070
      PORT: '2070'
      HEALTH_PATH: /api/v1/marketplace/health
    ports:
      - '128.0.0.255:2170:2070'
      - '128.0.0.255:2162:2070'
    env_file:
      - path: stack.env
        required: false
    command:
      - sh
      - -c
      - node dist/apps/marketplace/scripts/run-migrations.cjs && exec node --enable-source-maps dist/apps/marketplace/src/main
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT:-2070}${HEALTH_PATH:-/api/v1/marketplace/health} || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    networks:
      - cmnw

  # Skill sandbox runner: consumes skill.test-run (the Сандбокс test page).
  ai-documents-skill-runner:
    image: registry.cmnw.ru/ai-platform/ai-documents-backend:dev
    container_name: ai-documents-skill-runner
    restart: unless-stopped
    environment:
      APP_NAME: skill-runner
      PORT: '2071'
      HEALTH_PATH: /api/v1/skill-runner/health
    ports:
      - '128.0.0.255:2171:2071'
    env_file:
      - path: stack.env
        required: false
    networks:
      - cmnw

  # ESB orchestrator: consumes esb.run, executes pipeline DAGs (code nodes
  # power the agent's create_presentation tool; artifacts -> esb-artifacts).
  ai-documents-esb-orchestrator:
    image: registry.cmnw.ru/ai-platform/ai-documents-backend:dev
    container_name: ai-documents-esb-orchestrator
    restart: unless-stopped
    environment:
      APP_NAME: esb-orchestrator
      PORT: '2061'
      HEALTH_PATH: /api/v1/esb-orchestrator/health
      ESB_CODE_NODE_PACKAGES: pptxgenjs,jszip,@aws-sdk/client-s3,@aws-sdk/s3-request-presigner
      ESB_ARTIFACTS_BUCKET: esb-artifacts
      AWS_ENDPOINT_URL_S3: ${S3_PRESIGN_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_REGION: ${S3_REGION}
    ports:
      - '128.0.0.255:2161:2061'
    env_file:
      - path: stack.env
        required: false
    networks:
      - cmnw

  wiki:
    image: registry.cmnw.ru/ai-platform/wiki:dev
    container_name: wiki
    restart: unless-stopped
    # The merged stack.env carries the backend's PORT/HOST — docmost would
    # obey them; inline environment wins over env_file, pin its listener.
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
    ports:
      - '128.0.0.255:2054:3000'
    env_file:
      - path: stack.env
        required: false
    volumes:
      - wiki_storage:/app/data/storage
    networks:
      - cmnw

volumes:
  wiki_storage:
    name: ai_platform_wiki_storage
  ai_platform_nginx_conf:
    external: true

networks:
  cmnw:
    external: true
