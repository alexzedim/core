# Loki — single binary, filesystem storage, 30-day retention.
# THIS FILE IS THE RUNNING CONFIG: deployed to /srv/docker/analytics/loki-config.yaml
# on the host and bind-mounted into the loki container (absolute host paths
# survive Portainer's in-container compose; a relative `file:` source does not).
# Edit here, copy to /srv/docker/analytics/, "Pull and redeploy" the analytics stack.
auth_enabled: false

server:
    http_listen_port: 3100

common:
    instance_addr: 127.0.0.1
    path_prefix: /loki
    storage:
        filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
    replication_factor: 1
    ring:
        kvstore:
            store: inmemory

schema_config:
    configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

# Retention: the compactor marks and deletes everything older than
# retention_period (single uniform policy, no per-stream overrides).
# Deletion of already-ingested data lags by retention_delete_delay (default 2h).
compactor:
    working_directory: /loki/compactor
    delete_request_store: filesystem
    retention_enabled: true

limits_config:
    retention_period: 30d
    max_query_lookback: 30d

ruler:
    alertmanager_url: http://localhost:9093
