name: 'storage'
version: '3.8'
services:
  postgres:
    image: postgres:17.4
    container_name: postgres
    restart: always
    networks:
      - storage-network
      - cmnw
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MAX_CONNECTIONS: 250
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4.3-alpine
    restart: always
    container_name: redis
    command: redis-server --requirepass $REDIS_PASSWORD --appendonly yes
    volumes:
      - redis:/data:rw,z
    ports:
      - '6379:6379'
    networks:
      - storage-network
      - cmnw

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /bitnami/minio/data --console-address ":9001"
    volumes:
      - minio-s3:/bitnami/minio/data
    networks:
      - storage-network
      - cmnw

  rabbitmq:
    image: rabbitmq:4.2.2-management-alpine
    hostname: rabbitmq
    container_name: rabbitmq
    restart: always
    networks:
      - storage-network
      - cmnw
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_DEFAULT_VHOST=cmnw
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit log_levels [{connection,error},{default,error}] disk_free_limit 2147483648
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"

  # ============================================================================
  # RabbitScout — RabbitMQ management UI (alternative to the built-in admin)
  # ============================================================================
  rabbit-scout:
    image: ghcr.io/ralve-org/rabbitscout:latest
    container_name: rabbit-scout
    restart: always
    networks:
      - storage-network
      - cmnw
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 15672
      RABBITMQ_PROTOCOL: http
    ports:
      - '15673:3000'
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # pgvector — Postgres with the vector extension, dedicated to LightRAG
  # ============================================================================
  pgvector:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: pgvector
    restart: always
    networks:
      - storage-network
      - cmnw
    environment:
      POSTGRES_USER: ${LIGHTRAG_PG_USER}
      POSTGRES_PASSWORD: ${LIGHTRAG_PG_PASSWORD}
      POSTGRES_DB: ${LIGHTRAG_PG_DB}
    ports:
      - '${PGVECTOR_BIND_IP:-128.0.0.255}:5433:5432'
    volumes:
      - pgvector:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # Neo4j — graph storage for LightRAG (oraculum stack)
  # ============================================================================
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j
    restart: always
    networks:
      - storage-network
      - cmnw
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - '${NEO4J_BIND_IP:-128.0.0.255}:7474:7474'      # Neo4j Browser (HTTP, LAN only)
      - '${NEO4J_BIND_IP:-128.0.0.255}:7687:7687'      # Bolt protocol (LAN only)
    volumes:
      - neo4j:/data
    security_opt:
      - no-new-privileges:true

networks:
  storage-network:
    driver: bridge
  cmnw:
    external: true

volumes:
  postgres:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/mnt/postgres'
  rabbitmq:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/mnt/rabbitmq'
  redis:
    driver: local
  minio-s3:
    driver: local

  pgvector:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/mnt/pgvector'

  neo4j:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/mnt/neo4j'

