name: 'storage'
version: '3.8'
services:
  postgres:
    # pgvector image = official postgres:17 + pgvector extension pre-compiled.
    # Drop-in compatible with vanilla postgres:17.4 data dir at /mnt/postgres.
    # LightRAG auto-runs `CREATE EXTENSION IF NOT EXISTS vector` on first connect.
    image: pgvector/pgvector:0.8.0-pg17
    container_name: postgres
    restart: always
    networks:
      - storage-network
      - cmnw
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MAX_CONNECTIONS: 250
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7.4.3-alpine
    restart: always
    container_name: redis
    command: redis-server --requirepass $REDIS_PASSWORD --appendonly yes
    volumes:
      - redis:/data:rw,z
    ports:
      - '6379:6379'
    networks:
      - storage-network
      - cmnw

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /bitnami/minio/data --console-address ":9001"
    volumes:
      - minio-s3:/bitnami/minio/data
    networks:
      - storage-network
      - cmnw

  rabbitmq:
    image: rabbitmq:4.2.2-management-alpine
    hostname: rabbitmq
    container_name: rabbitmq
    restart: always
    networks:
      - storage-network
      - cmnw
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_DEFAULT_VHOST=cmnw
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit log_levels [{connection,error},{default,error}] disk_free_limit 2147483648
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"

  # ============================================================================
  # Qdrant — Vector database
  # ============================================================================
  # Shared by AI/RAG workloads (LightRAG, open-webui, etc.) over the `cmnw`
  # network. Bind-mount preserves existing data at /mnt/qdrant — do not change
  # the device path without migrating the data first.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    networks:
      - storage-network
      - cmnw
    ports:
      - "6333:6333"      # REST API
      - "6334:6334"      # gRPC API
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY}
      QDRANT_TELEMETRY_DISABLED: ${QDRANT_TELEMETRY_DISABLED}
      QDRANT_LOG_LEVEL: ${QDRANT_LOG_LEVEL}
    volumes:
      - qdrant:/qdrant
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # Neo4j — Graph database (LightRAG graph storage)
  # ============================================================================
  # Single bind mount for /data (graph databases, transactions, schema) — matches
  # the one-volume-per-service pattern used by postgres/rabbitmq/qdrant. Logs go
  # to container stdout; import/plugins dirs stay in the container layer.
  #
  # First-time setup on the server (uid 7474 = the neo4j user inside the
  # container; Neo4j refuses to start without write access):
  #
  #   sudo mkdir -p /mnt/neo4j
  #   sudo chown -R 7474:7474 /mnt/neo4j
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j
    restart: always
    networks:
      - storage-network
      - cmnw
    ports:
      - "7474:7474"      # Neo4j Browser (HTTP)
      - "7687:7687"      # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j:/data
    security_opt:
      - no-new-privileges:true

networks:
  storage-network:
    driver: bridge
  cmnw:
    external: true

volumes:
  postgres:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/mnt/postgres'
  rabbitmq:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/mnt/rabbitmq'
  redis:
    driver: local
  minio-s3:
    driver: local

  qdrant:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/mnt/qdrant'

  neo4j:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/mnt/neo4j'

