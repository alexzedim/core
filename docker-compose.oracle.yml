name: 'oracle'
services:
  vpn-oracle:
    image: ghcr.io/alexzedim/adguard:latest
    pull_policy: if_not_present
    container_name: vpn-oracle
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - stack.env
    environment:
      VPN_LOCATION: ${VPN_LOCATION_ORACLE:-}
      APP_NAME: oracle
      GATEWAY_BOOT_DELAY: '0'
    volumes:
      - vpn-oracle-adguard:/var/lib/adguardvpn
    ports:
      - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_VNC_PORT:-6181}:6080'
      - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_CDP_PORT:-9321}:9222'
    networks:
      - oraculum
      - cmnw

  oracle:
    image: ghcr.io/alexzedim/oracle:latest
    pull_policy: if_not_present
    container_name: oracle
    network_mode: 'service:vpn-oracle'
    depends_on:
      vpn-oracle:
        condition: service_healthy
    restart: always
    env_file:
      - stack.env
    shm_size: '1gb'
    command: ['node', 'dist/apps/oracle/src/main.js']
    environment:
      DISCORD_TZ_HINT: ${DISCORD_TZ_HINT_ORACLE:-}
      NODE_ENV: production
      APP_NAME: oracle
    volumes:
      - oracle-secrets:/app/secrets:rw

  vpn-oracle-1d:
    image: ghcr.io/alexzedim/adguard:latest
    pull_policy: if_not_present
    container_name: vpn-oracle-1d
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - stack.env
    environment:
      VPN_LOCATION: ${VPN_LOCATION_1D:-}
      APP_NAME: oracle-1d
      GATEWAY_BOOT_DELAY: '40'
    volumes:
      - vpn-oracle-1d-adguard:/var/lib/adguardvpn
    ports:
      - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_1D_VNC_PORT:-6182}:6080'
      - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_1D_CDP_PORT:-9322}:9222'
    networks:
      - oraculum
      - cmnw

  oracle-1d:
    image: ghcr.io/alexzedim/oracle-1d:latest
    pull_policy: if_not_present
    container_name: oracle-1d
    network_mode: 'service:vpn-oracle-1d'
    depends_on:
      vpn-oracle-1d:
        condition: service_healthy
    restart: always
    env_file:
      - stack.env
    shm_size: '1gb'
    command: ['node', 'dist/apps/oracle-1d/src/main.js']
    environment:
      TZ: ${TZ_1D:-}
      NODE_ENV: production
      APP_NAME: oracle-1d
    volumes:
      - oracle-1d-secrets:/app/secrets:rw

  vpn-oracle-2bd:
    image: ghcr.io/alexzedim/adguard:latest
    pull_policy: if_not_present
    container_name: vpn-oracle-2bd
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - stack.env
    environment:
      VPN_LOCATION: ${VPN_LOCATION_2BD:-}
      APP_NAME: oracle-2bd
      GATEWAY_BOOT_DELAY: '80'
    volumes:
      - vpn-oracle-2bd-adguard:/var/lib/adguardvpn
    ports:
      - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_2BD_VNC_PORT:-6183}:6080'
      - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_2BD_CDP_PORT:-9323}:9222'
    networks:
      - oraculum
      - cmnw

  oracle-2bd:
    image: ghcr.io/alexzedim/oracle-2bd:latest
    pull_policy: if_not_present
    container_name: oracle-2bd
    network_mode: 'service:vpn-oracle-2bd'
    depends_on:
      vpn-oracle-2bd:
        condition: service_healthy
    restart: always
    env_file:
      - stack.env
    shm_size: '1gb'
    command: ['node', 'dist/apps/oracle-2bd/src/main.js']
    environment:
      TZ: ${TZ_2BD:-}
      NODE_ENV: production
      APP_NAME: oracle-2bd
    volumes:
      - oracle-2bd-secrets:/app/secrets:rw

  vpn-oracle-3s:
    image: ghcr.io/alexzedim/adguard:latest
    pull_policy: if_not_present
    container_name: vpn-oracle-3s
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - stack.env
    environment:
      VPN_LOCATION: ${VPN_LOCATION_3S:-}
      APP_NAME: oracle-3s
      GATEWAY_BOOT_DELAY: '120'
    volumes:
      - vpn-oracle-3s-adguard:/var/lib/adguardvpn
    ports:
      - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_3S_VNC_PORT:-6184}:6080'
      - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_3S_CDP_PORT:-9324}:9222'
    networks:
      - oraculum
      - cmnw

  oracle-3s:
    image: ghcr.io/alexzedim/oracle-3s:latest
    pull_policy: if_not_present
    container_name: oracle-3s
    network_mode: 'service:vpn-oracle-3s'
    depends_on:
      vpn-oracle-3s:
        condition: service_healthy
    shm_size: '1gb'
    env_file:
      - stack.env
    command: ['node', 'dist/apps/oracle-3s/src/main.js']
    environment:
      DISCORD_TZ_HINT: ${DISCORD_TZ_HINT_3S:-}
      NODE_ENV: production
      APP_NAME: oracle-3s
    volumes:
      - oracle-3s-secrets:/app/secrets:rw

volumes:
  oracle-secrets:
  oracle-1d-secrets:
  oracle-2bd-secrets:
  oracle-3s-secrets:
  vpn-oracle-adguard:
  vpn-oracle-1d-adguard:
  vpn-oracle-2bd-adguard:
  vpn-oracle-3s-adguard:

networks:
  oraculum:
    driver: bridge
  cmnw:
    external: true
