name: 'oracle'
services:
  vpn-oracle:
    image: ghcr.io/alexzedim/adguard:latest
    pull_policy: if_not_present
    container_name: vpn-oracle
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - stack.env
    environment:
      APP_NAME: oracle
    volumes:
      - vpn-oracle-adguard:/var/lib/adguardvpn
      - oracle-geo:/var/lib/oraculum
    ports:
      - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_VNC_PORT:-6181}:6080'
      - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_CDP_PORT:-9321}:9222'
    networks:
      - oraculum
      - cmnw

  oracle:
    image: ghcr.io/alexzedim/oracle:latest
    pull_policy: if_not_present
    container_name: oracle
    network_mode: 'service:vpn-oracle'
    depends_on:
      vpn-oracle:
        condition: service_healthy
    restart: always
    env_file:
      - stack.env
    shm_size: '1gb'
    command: ['node', 'dist/apps/oracle/src/main.js']
    environment:
      NODE_ENV: production
      APP_NAME: oracle
    volumes:
      - oracle-secrets:/app/secrets:rw
      - oracle-geo:/var/lib/oraculum:ro

  vpn-oracle-1d:
    image: ghcr.io/alexzedim/adguard:latest
    pull_policy: if_not_present
    container_name: vpn-oracle-1d
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - stack.env
    environment:
      APP_NAME: oracle-1d
    volumes:
      - vpn-oracle-1d-adguard:/var/lib/adguardvpn
      - oracle-1d-geo:/var/lib/oraculum
    ports:
      - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_1D_VNC_PORT:-6182}:6080'
      - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_1D_CDP_PORT:-9322}:9222'
    networks:
      - oraculum
      - cmnw

  oracle-1d:
    image: ghcr.io/alexzedim/oracle-1d:latest
    pull_policy: if_not_present
    container_name: oracle-1d
    network_mode: 'service:vpn-oracle-1d'
    depends_on:
      vpn-oracle-1d:
        condition: service_healthy
    restart: always
    env_file:
      - stack.env
    shm_size: '1gb'
    command: ['node', 'dist/apps/oracle-1d/src/main.js']
    environment:
      NODE_ENV: production
      APP_NAME: oracle-1d
    volumes:
      - oracle-1d-secrets:/app/secrets:rw
      - oracle-1d-geo:/var/lib/oraculum:ro

  vpn-oracle-2bd:
    image: ghcr.io/alexzedim/adguard:latest
    pull_policy: if_not_present
    container_name: vpn-oracle-2bd
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - stack.env
    environment:
      APP_NAME: oracle-2bd
    volumes:
      - vpn-oracle-2bd-adguard:/var/lib/adguardvpn
      - oracle-2bd-geo:/var/lib/oraculum
    ports:
      - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_2BD_VNC_PORT:-6183}:6080'
      - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_2BD_CDP_PORT:-9323}:9222'
    networks:
      - oraculum
      - cmnw

  oracle-2bd:
    image: ghcr.io/alexzedim/oracle-2bd:latest
    pull_policy: if_not_present
    container_name: oracle-2bd
    network_mode: 'service:vpn-oracle-2bd'
    depends_on:
      vpn-oracle-2bd:
        condition: service_healthy
    restart: always
    env_file:
      - stack.env
    shm_size: '1gb'
    command: ['node', 'dist/apps/oracle-2bd/src/main.js']
    environment:
      NODE_ENV: production
      APP_NAME: oracle-2bd
    volumes:
      - oracle-2bd-secrets:/app/secrets:rw
      - oracle-2bd-geo:/var/lib/oraculum:ro

  vpn-oracle-3s:
    image: ghcr.io/alexzedim/adguard:latest
    pull_policy: if_not_present
    container_name: vpn-oracle-3s
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - stack.env
    environment:
      APP_NAME: oracle-3s
    volumes:
      - vpn-oracle-3s-adguard:/var/lib/adguardvpn
      - oracle-3s-geo:/var/lib/oraculum
    ports:
      - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_3S_VNC_PORT:-6184}:6080'
      - '${ORACLE_BIND_IP:-128.0.0.255}:${ORACLE_3S_CDP_PORT:-9324}:9222'
    networks:
      - oraculum
      - cmnw

  oracle-3s:
    image: ghcr.io/alexzedim/oracle-3s:latest
    pull_policy: if_not_present
    container_name: oracle-3s
    network_mode: 'service:vpn-oracle-3s'
    depends_on:
      vpn-oracle-3s:
        condition: service_healthy
    shm_size: '1gb'
    env_file:
      - stack.env
    command: ['node', 'dist/apps/oracle-3s/src/main.js']
    environment:
      NODE_ENV: production
      APP_NAME: oracle-3s
    volumes:
      - oracle-3s-secrets:/app/secrets:rw
      - oracle-3s-geo:/var/lib/oraculum:ro

volumes:
  oracle-geo:
  oracle-1d-geo:
  oracle-2bd-geo:
  oracle-3s-geo:
  oracle-secrets:
  oracle-1d-secrets:
  oracle-2bd-secrets:
  oracle-3s-secrets:
  vpn-oracle-adguard:
  vpn-oracle-1d-adguard:
  vpn-oracle-2bd-adguard:
  vpn-oracle-3s-adguard:

networks:
  oraculum:
    driver: bridge
  cmnw:
    external: true
