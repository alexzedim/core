# Scraper apps joined to the vpn-oracle* gateways' netns (gateways live in
# compose.network.yaml, stack 'network'). Deploy this stack AFTER any change
# to the network stack; never restart a vpn-oracle* container alone.
# See AGENTS.md "AdGuard - Home + VPN fleet".

services:
    oracle:
        image: ghcr.io/alexzedim/oracle:latest
        pull_policy: if_not_present
        container_name: oracle
        network_mode: 'container:vpn-oracle'
        restart: always
        env_file:
            - stack.env
        shm_size: '1gb'
        command: ['node', 'dist/apps/oracle/src/main.js']
        environment:
            NODE_ENV: production
            APP_NAME: oracle
        volumes:
            - oracle-secrets:/app/secrets:rw
            - oracle-geo:/var/lib/oraculum

    oracle-1d:
