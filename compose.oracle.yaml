    oracle-1d-geo:
    oracle-2bd-geo:
    oracle-3s-geo:
    oracle-4qr-geo:
    oracle-5se-geo:
    oracle-secrets:
    oracle-1d-secrets:
    oracle-2bd-secrets:
    oracle-3s-secrets:
    oracle-4qr-secrets:
    oracle-5se-secrets:
