name: build-home-assistant

on:
  push:
    paths:
      - 'home-assistant/**'
      - '.github/workflows/build-home-assistant.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./home-assistant
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/home-assistant:2026.9.4-nuc
            ghcr.io/${{ github.repository_owner }}/home-assistant:latest
