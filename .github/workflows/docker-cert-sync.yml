# Builds and publishes the `cert-sync` sidecar image to GHCR.
#
# The routing stack (docker-compose.routing.yml) deploys this image via
# Portainer, which `compose pull`s every service before bringing the stack up.
# Since cert-sync has no upstream registry image, it must be built and pushed
# here — otherwise the stack fails to deploy with "pull access denied for
# cmnw/cert-sync, repository does not exist".
#
# Image: ghcr.io/alexzedim/core/cert-sync
# Triggers: push to master touching cert-sync/, and v* tags.
name: Build & publish cert-sync image

on:
  push:
    branches: [master]
    paths:
      - 'cert-sync/**'
      - '.github/workflows/docker-cert-sync.yml'
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cert-sync

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # v1.2.3 -> 1.2.3, 1.2, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # branch push -> branch name (e.g. master)
            type=ref,event=branch
            # sha for traceability
            type=sha,format=short
            # latest follows the most recent successful build on master / a tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cert-sync
          file: ./cert-sync/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
