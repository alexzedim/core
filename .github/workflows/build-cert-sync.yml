name: build-cert-sync

on:
  push:
    paths:
      - 'cert-sync/**'
      - '.github/workflows/build-cert-sync.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./cert-sync
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cert-sync:1.0.0
            ghcr.io/${{ github.repository_owner }}/cert-sync:latest
