name: "git"
version: "3.8"
services:
  cmnw-github-runner-I:
    image: myoung34/github-runner:latest
    container_name: cmnw-github-runner-I
    environment:
      # Required: Your GitHub repository or organization
      REPO_URL: https://github.com/alexzedim/cmnw

      # Required: GitHub Personal Access Token or Registration Token
      # For repo: needs 'repo' scope
      # For org: needs 'admin:org' scope
      ACCESS_TOKEN: ${GITHUB_TOKEN}

      # Optional: Runner name (defaults to hostname)
      RUNNER_NAME: cmnw-runner-I

      # Optional: Runner labels (comma separated)
      RUNNER_LABELS: docker,linux,self-hosted,cmnw

      # Optional: Runner group (for organizations)
      # RUNNER_GROUP: default

      # Optional: Working directory
      # RUNNER_WORKDIR: /tmp/runner/work

    volumes:
      # Mount Docker socket for Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock

      # Persistent runner work directory
      - cmnw-runner-work:/tmp/runner/work

      # Optional: Mount host directories for builds
      - ./builds:/builds

      # Optional: Cache directories for faster builds
      - cmnw-runner-work:/home/runner/.cache

    restart: always

    # Optional: Resource limits
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "2.0"
          memory: 4G

    # Optional: Network configuration
    networks:
      - runner-network

    # Optional: Security options
    # security_opt:
    #    - no-new-privileges:true

  cmnw-github-runner-II:
    image: myoung34/github-runner:latest
    container_name: cmnw-github-runner-II
    environment:
      REPO_URL: https://github.com/alexzedim/cmnw
      ACCESS_TOKEN: ${GITHUB_TOKEN}
      RUNNER_NAME: cmnw-runner-II
      RUNNER_LABELS: docker,linux,self-hosted,cmnw
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cmnw-runner-work:/tmp/runner/work
      - ./builds:/builds
      - cmnw-runner-work:/home/runner/.cache
    restart: always
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "2.0"
          memory: 4G

    networks:
      - runner-network

  cmnw-github-runner-III:
    image: myoung34/github-runner:latest
    container_name: cmnw-github-runner-III
    environment:
      REPO_URL: https://github.com/alexzedim/cmnw
      ACCESS_TOKEN: ${GITHUB_TOKEN}
      RUNNER_NAME: cmnw-runner-III
      RUNNER_LABELS: docker,linux,self-hosted,cmnw
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cmnw-runner-work:/tmp/runner/work
      - ./builds:/builds
      - cmnw-runner-work:/home/runner/.cache
    restart: always
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "2.0"
          memory: 4G

    networks:
      - runner-network

  # Optional: Multiple runners
  oraculum-github-runner-I:
    image: myoung34/github-runner:latest
    container_name: oraculum-github-runner-I
    environment:
      REPO_URL: https://github.com/alexzedim/oraculum
      ACCESS_TOKEN: ${GITHUB_TOKEN}
      RUNNER_NAME: oraculum-runner-I
      RUNNER_LABELS: docker,linux,self-hosted,oraculum
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - oraculum-runner-work:/tmp/runner/work
      - ./builds:/builds
    restart: always
    networks:
      - runner-network

  oraculum-github-runner-II:
    image: myoung34/github-runner:latest
    container_name: oraculum-github-runner-II
    environment:
      REPO_URL: https://github.com/alexzedim/oraculum
      ACCESS_TOKEN: ${GITHUB_TOKEN}
      RUNNER_NAME: oraculum-runner-II
      RUNNER_LABELS: docker,linux,self-hosted,oraculum
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - oraculum-runner-work:/tmp/runner/work
      - ./builds:/builds
    restart: always
    networks:
      - runner-network

  docker-prune:
    image: docker:28.5.0-cli
    container_name: docker-prune
    restart: unless-stopped
    environment:
      TZ: MSK-3
      DOCKER_PRUNE_CRON: ${DOCKER_PRUNE_CRON:-30 4 * * *}
      DOCKER_PRUNE_RETENTION: ${DOCKER_PRUNE_RETENTION:-48h}
    command:
      - sh
      - -c
      - |
        echo "$${DOCKER_PRUNE_CRON} sh /usr/local/bin/prune.sh $${DOCKER_PRUNE_RETENTION} >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
        exec /usr/sbin/crond -f -l 8
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none
    configs:
      - source: docker-prune-script
        target: /usr/local/bin/prune.sh

volumes:
  cmnw-runner-work:
    driver: local
  oraculum-runner-work:
    driver: local

configs:
  docker-prune-script:
    content: |
      docker container prune -f --filter "until=$1"
      docker image prune -a -f --filter "until=$1"
      docker builder prune -a -f --filter "until=$1"

networks:
  runner-network:
    driver: bridge
  storage-network:
    driver: bridge
