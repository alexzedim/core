name: 'oraculum'
services:
  # kerberos — not deployed yet; uncomment when the fleet goes live
  # kerberos:
  #   image: ghcr.io/alexzedim/kerberos:latest
  #   pull_policy: if_not_present
  #   container_name: kerberos
  #   restart: always
  #   command: ['node', 'dist/apps/kerberos/src/main.js']
  #   env_file:
  #     - stack.env
  #   environment:
  #     NODE_ENV: production
  #     APP_NAME: kerberos
  #   networks:
  #     - oraculum

  indexator:
    image: ghcr.io/alexzedim/indexator:v1.1.7
    pull_policy: if_not_present
    container_name: indexator
    restart: always
    command: ['node', 'dist/apps/indexator/src/main.js']
    env_file:
      - stack.env
    environment:
      NODE_ENV: production
      APP_NAME: indexator
    networks:
      - oraculum

  oracular:
    image: ghcr.io/alexzedim/oracular:latest
    pull_policy: if_not_present
    container_name: oracular
    restart: always
    command: ['node', 'dist/apps/oracular/src/main.js']
    env_file:
      - stack.env
    environment:
      NODE_ENV: production
      APP_NAME: oracular
      HTTP_PROXY: http://128.0.0.255:3128
      HTTPS_PROXY: http://128.0.0.255:3128
      NO_PROXY: localhost,127.0.0.1,128.0.0.255,oraculum,indexator,archivum,lightrag,gateway,rabbitmq,redis
    networks:
      - oraculum

  archivum:
    image: ghcr.io/alexzedim/archivum:latest
    pull_policy: if_not_present
    container_name: archivum
    restart: always
    command: ['node', 'dist/apps/archivum/src/main.js']
    env_file:
      - stack.env
    environment:
      NODE_ENV: production
      APP_NAME: archivum
    networks:
      - oraculum

  gateway:
    image: ghcr.io/alexzedim/gateway:latest
    pull_policy: if_not_present
    container_name: gateway
    restart: always
    command: ['node', 'dist/apps/gateway/src/main.js']
    env_file:
      - stack.env
    environment:
      NODE_ENV: production
      APP_NAME: gateway
      FORWARD_PROXY_BIND: 0.0.0.0
      FORWARD_PROXY_PORT: 3128
      FORWARD_PROXY_HEALTH_PORT: 3129
      FORWARD_PROXY_UPSTREAM_TIMEOUT_MS: 15000
      FORWARD_PROXY_HEADER_READ_TIMEOUT_MS: 10000
      FORWARD_PROXY_MAX_HEADER_BYTES: 65536
    network_mode: host
    volumes:
      - gateway-adguard:/var/lib/adguardvpn:rw

  lightrag:
    image: ghcr.io/alexzedim/lightrag:1.5.6-exp.b88eec86
    pull_policy: if_not_present
    container_name: lightrag
    restart: always
    ports:
      - '${LIGHTRAG_BIND_IP:-128.0.0.255}:9621:8084'      # LightRAG fork API (LAN only)
    env_file:
      - stack.env
    environment:
      POSTGRES_HOST: ${LIGHTRAG_PG_HOST}
      POSTGRES_PORT: ${LIGHTRAG_PG_PORT}
      POSTGRES_USER: ${LIGHTRAG_PG_USER}
      POSTGRES_PASSWORD: ${LIGHTRAG_PG_PASSWORD}
      POSTGRES_DATABASE: ${LIGHTRAG_PG_DB}
      HTTP_PROXY: http://128.0.0.255:3128
      HTTPS_PROXY: http://128.0.0.255:3128
      NO_PROXY: localhost,127.0.0.1,128.0.0.255,oraculum,indexator,archivum,lightrag,gateway,rabbitmq,redis
    networks:
      - oraculum
    security_opt:
      - no-new-privileges:true

volumes:
  gateway-adguard:

networks:
  oraculum:
    driver: bridge
