name: 'oraculum'
services:
  # kerberos — not deployed yet; uncomment when the fleet goes live
  # kerberos:
  #   image: ghcr.io/alexzedim/kerberos:latest
  #   pull_policy: if_not_present
  #   container_name: kerberos
  #   restart: always
  #   command: ['node', 'dist/apps/kerberos/src/main.js']
  #   env_file:
  #     - stack.env
  #   environment:
  #     NODE_ENV: production
  #     APP_NAME: kerberos
  #   networks:
  #     - oraculum

  indexator:
    image: ghcr.io/alexzedim/indexator:latest
    pull_policy: if_not_present
    container_name: indexator
    restart: always
    command: ['node', 'dist/apps/indexator/src/main.js']
    env_file:
      - stack.env
    environment:
      NODE_ENV: production
      APP_NAME: indexator
    networks:
      - oraculum

  oracular:
    image: ghcr.io/alexzedim/oracular:latest
    pull_policy: if_not_present
    container_name: oracular
    restart: always
    command: ['node', 'dist/apps/oracular/src/main.js']
    env_file:
      - stack.env
    environment:
      NODE_ENV: production
      APP_NAME: oracular
    networks:
      - oraculum

  archivum:
    image: ghcr.io/alexzedim/archivum:latest
    pull_policy: if_not_present
    container_name: archivum
    restart: always
    command: ['node', 'dist/apps/archivum/src/main.js']
    env_file:
      - stack.env
    environment:
      NODE_ENV: production
      APP_NAME: archivum
    networks:
      - oraculum

  gateway:
    image: ghcr.io/alexzedim/gateway:latest
    pull_policy: if_not_present
    container_name: gateway
    restart: always
    command: ['node', 'dist/apps/gateway/src/main.js']
    env_file:
      - stack.env
    environment:
      NODE_ENV: production
      APP_NAME: gateway
    network_mode: host
    volumes:
      - gateway-adguard:/var/lib/adguardvpn:rw

  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lightrag
    restart: always
    ports:
      - '${LIGHTRAG_BIND_IP:-128.0.0.255}:9621:9621'      # LightRAG API + Web UI (LAN only)
    env_file:
      - stack.env
    environment:
      HOST: 0.0.0.0
      PORT: 9621
      TOKEN_SECRET: ${LIGHTRAG_TOKEN_SECRET}
      POSTGRES_PORT: ${LIGHTRAG_PG_PORT}
      POSTGRES_USER: ${LIGHTRAG_PG_USER}
      POSTGRES_PASSWORD: ${LIGHTRAG_PG_PASSWORD}
    volumes:
      - lightrag-data:/app/data
    networks:
      - oraculum
    security_opt:
      - no-new-privileges:true

volumes:
  lightrag-data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/mnt/lightrag'
  gateway-adguard:

networks:
  oraculum:
    driver: bridge
