name: 'gitlab'

services:
  gitlab:
    image: gitlab/gitlab-ce:19.0.1-ce.0
    container_name: gitlab
    restart: always
    ports:
      - "8083:80"
      - "8443:443"
    shm_size: 2g
    volumes:
      - git_config:/etc/gitlab
      - git_data:/var/opt/gitlab
      - git_logs:/var/log/gitlab
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD}
      GITLAB_OMNIBUS_CONFIG: |
        gitlab_rails['monitoring_whitelist'] = ['127.0.0.0/8', '::1/128', '172.16.0.0/12', '10.0.0.0/8', '192.168.0.0/16']
    networks:
      - cmnw

  gitlab-ssh:
    image: alpine/socat:1.8.0.1
    container_name: gitlab-ssh
    restart: always
    command: tcp-listen:22,fork,reuseaddr tcp-connect:gitlab:22
    ports:
      - "2222:22"
    depends_on:
      - gitlab
    networks:
      - cmnw

networks:
  cmnw:
    external: true

volumes:
  git_config:
    name: git_config
  git_data:
    name: git_data
  git_logs:
    name: git_logs
