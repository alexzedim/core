name: 'routing'
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: cmnw-nginx
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
    ports:
      - "80:80"
      - "443:443"
      - "2222:2222"  # GitLab SSH proxy
    expose:
      - "8080"
    volumes:
      - nginx-config:/etc/nginx:ro
      - nginx-logs:/var/log/nginx
    networks:
      - edge
      - cmnw

  nginx-ui:
    image: uozi/nginx-ui:latest
    container_name: cmnw-nginx-ui
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
    ports:
      - "9080:9000"
    volumes:
      - nginx-config:/etc/nginx
      - nginx-ui-state:/etc/nginx-ui
      - nginx-logs:/var/log/nginx
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - nginx
    networks:
      - edge
      - cmnw

  nginx-metrics:
    image: nginx/nginx-prometheus-exporter:1.4.0
    container_name: cmnw-nginx-metrics
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://cmnw-nginx:8080/stub_status
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    networks:
      - edge

  # Auto-syncs the cmnw.ru cert from Yandex Cloud Certificate Manager into the
  # nginx-config volume (-> /etc/nginx/.certs on host = /mnt/nginx/.certs) and
  # reloads nginx when it changes. See cert-sync/README.md for host setup.
  #
  # Image is built & published by .github/workflows/docker-cert-sync.yml.
  # Portainer runs `compose pull` before `up`, so the image MUST exist on a
  # registry — the local `build:` alone isn't enough (it left Portainer unable
  # to pull "cmnw/cert-sync:local"). `build:` is kept so `up --build` still
  # works from the CLI for local iteration.
  cert-sync:
    build: ./cert-sync
    image: ghcr.io/alexzedim/core/cert-sync:latest
    pull_policy: missing
    container_name: cmnw-cert-sync
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      - YC_CERT_ID=${YC_CERT_ID}
      # YC_AUTHORIZED_KEY is provided via Portainer env (full authorized_key.json
      # contents). Alternatively, mount the file at /secrets/authorized_key.json.
    volumes:
      - nginx-config:/certs                    # shares the same volume nginx reads (writable here)
      - /var/run/docker.sock:/var/run/docker.sock  # for `docker exec cmnw-nginx nginx -s reload`
    networks:
      - edge
    depends_on:
      - nginx

networks:
  edge:
    name: cmnw_edge
    driver: bridge
  cmnw:
    external: true

volumes:
  nginx-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: '/mnt/nginx'
  nginx-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: '/mnt/nginx/logs'
  nginx-ui-state:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: '/mnt/nginx-ui'
