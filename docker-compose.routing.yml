name: 'routing'
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: cmnw-nginx
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
    ports:
      - "80:80"
      - "443:443"
      - "2222:2222"  # GitLab SSH proxy
    expose:
      - "8080"
    volumes:
      - nginx-config:/etc/nginx:ro
      - nginx-logs:/var/log/nginx
    networks:
      - edge
      - cmnw

  nginx-ui:
    image: uozi/nginx-ui:latest
    container_name: cmnw-nginx-ui
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
    ports:
      - "9080:9000"
    volumes:
      - nginx-config:/etc/nginx
      - nginx-ui-state:/etc/nginx-ui
      - nginx-logs:/var/log/nginx
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - nginx
    networks:
      - edge
      - cmnw

  nginx-metrics:
    image: nginx/nginx-prometheus-exporter:1.4.0
    container_name: cmnw-nginx-metrics
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://cmnw-nginx:8080/stub_status
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    networks:
      - edge

  # Auto-syncs the cmnw.ru cert from Yandex Cloud Certificate Manager into the
  # nginx-config volume (-> /etc/nginx/.certs on host = /mnt/nginx/.certs) and
  # reloads nginx when it changes. See cert-sync/README.md for host setup.
  cert-sync:
    build: ./cert-sync
    image: cmnw/cert-sync:local
    container_name: cmnw-cert-sync
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      - YC_CERT_ID=${YC_CERT_ID}
    volumes:
      - nginx-config:/certs                    # shares the same volume nginx reads (writable here)
      - /var/run/docker.sock:/var/run/docker.sock  # for `docker exec cmnw-nginx nginx -s reload`
      - /mnt/cert-sync/secrets:/secrets:ro     # authorized_key.json lives on the host
    networks:
      - edge
    depends_on:
      - nginx

networks:
  edge:
    name: cmnw_edge
    driver: bridge
  cmnw:
    external: true

volumes:
  nginx-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: '/mnt/nginx'
  nginx-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: '/mnt/nginx/logs'
  nginx-ui-state:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: '/mnt/nginx-ui'
